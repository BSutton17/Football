<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <!-- Allow pinch-to-zoom OUT (down to 0.5) but cap at 1.0 so the page can't be zoomed IN
         (intentionally or accidentally). -->
    <!-- [mobile] A game, not a document: there is nothing to zoom into, and being stuck zoomed
         mid-match forced a player to quit. `user-scalable=no` is ignored by iOS Safari, which is
         why src/utils/lockZoom.ts also blocks its gesture events and can force the scale back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>E-Football</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
